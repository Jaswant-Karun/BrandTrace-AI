[project]
name = "brandtrace-api"
version = "1.0.0"
description = "BRANDTRACE AI Governance Engine API"
authors = [{ name = "BrandTrace AI Team" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "networkx>=3.4.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "httpx2>=2.16.0",
    "numpy>=2.0.0",
    "python-dotenv>=1.0.1",
    "motor>=3.6.0",
    "pymongo>=4.9.0",
    "pyjwt>=2.9.0",
    "cryptography>=43.0.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "pillow>=10.4.0",
    "opencv-python-headless>=4.10.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
